name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flightsaver .
      - name: Smoke test
        run: |
          docker run -d --name fs -p 8000:8000 flightsaver
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q FlightSaver
          docker logs fs
