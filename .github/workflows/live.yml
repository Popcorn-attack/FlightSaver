name: Live search smoke test

# Runs real searches through every provider from GitHub's network and reports
# results and peak memory (the Render free plan has 512 MB).
on:
  push:
    paths:
      - "src/flightsaver/providers/**"
      - "src/flightsaver/search.py"
      - "src/flightsaver/explore.py"
      - "src/flightsaver/web/quick.py"
      - "Dockerfile"
      - ".github/workflows/live.yml"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLIGHTSAVER_BROWSER_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra browser
      - run: uv run playwright install --with-deps chromium
      - name: Search (one-way and round trip)
        run: |
          (peak=0; while true; do
             rss=$(ps -eo rss= | awk '{s+=$1} END {print s}'); [ "$rss" -gt "$peak" ] && peak=$rss
             echo $peak > /tmp/peak; sleep 0.5; done) &
          base=$(ps -eo rss= | awk '{s+=$1} END {print s}')
          dep=$(date -d '+45 days' +%F); ret=$(date -d '+59 days' +%F)
          time uv run flightsaver search LON SHANGHAI "$dep" --no-history --limit 8
          time uv run flightsaver search MAN PEK "$dep" --return "$ret" --no-history --limit 8
          echo "peak extra RSS: $(( ($(cat /tmp/peak) - base) / 1024 )) MB"

  container-sim:
    # The deployed image under each host's memory limit:
    #   cloudrun: 2 GiB, all providers, two browsers at a time
    #   render-free: 512 MB, lean browser, one page at a time, Google + Trip.com only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloudrun
            memory: 2g
            env: -e FLIGHTSAVER_BROWSER_CONCURRENCY=2
          - name: render-free
            memory: 512m
            env: >-
              -e FLIGHTSAVER_BROWSER_LEAN=1 -e FLIGHTSAVER_BROWSER_CONCURRENCY=1
              -e FLIGHTSAVER_PROVIDERS=google_flights,trip_com
    name: container-sim (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flightsaver .
      - name: Search inside a ${{ matrix.memory }} container
        run: |
          dep=$(date -d '+45 days' +%F); ret=$(date -d '+59 days' +%F)
          docker run --rm --memory=${{ matrix.memory }} --memory-swap=${{ matrix.memory }} \
            --shm-size=256m ${{ matrix.env }} flightsaver bash -c "
              time /app/.venv/bin/flightsaver search LON SHANGHAI $dep --return $ret --no-history --limit 3;
              code=\$?;
              echo peak_mb=\$((\$(cat /sys/fs/cgroup/memory.peak) / 1048576));
              grep oom_kill /sys/fs/cgroup/memory.events;
              exit \$code" 2>&1 | tee out.txt
          ! grep -q "Page crashed" out.txt
          grep -q "oom_kill 0" out.txt

  render-web:
    # The Render free configuration end to end: web server + quick search in 512 MB.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flightsaver .
      - name: Quick search through the web API
        run: |
          docker run -d --name fs --memory=512m --memory-swap=512m --shm-size=128m -p 8000:8000 \
            -e FLIGHTSAVER_BROWSER_LEAN=1 -e FLIGHTSAVER_BROWSER_CONCURRENCY=1 \
            -e FLIGHTSAVER_PROVIDERS=google_flights,trip_com \
            -e FLIGHTSAVER_HISTORY=/tmp/h.sqlite3 flightsaver
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          dep=$(date -d '+45 days' +%F)
          for q in "伦敦飞上海 $dep" "查一下爱丁堡从十月底开始到11月中的飞国内任何城市的直飞航班信息与价格"; do
            start=$(date +%s)
            curl -s -X POST localhost:8000/api/search -H 'Content-Type: application/json' \
              -d "{\"message\": \"$q\"}" > out.json
            echo "== $q ($(( $(date +%s) - start ))s)"
            grep -q '"message"' out.json || { head -c 600 out.json; echo; docker logs fs 2>&1 | tail -40; exit 1; }
            python3 -c "import json; d=json.load(open('out.json')); print(d.get('understood')); \
          print(d['message']); print('sources', d['data']['source_counts'], \
          'errors', d['data']['source_errors']); \
          [print('  ', r) for r in d['data'].get('explore', {}).get('routes', [])]; \
          [print('  offer', o['price'], o['airlines'], o['route'], o['departure']) \
           for o in d['data']['offers'][:5]]"
          done
          docker exec fs sh -c 'echo peak_mb=$(( $(cat /sys/fs/cgroup/memory.peak) / 1048576 )); \
            grep oom_kill /sys/fs/cgroup/memory.events' | tee mem.txt
          grep -q "oom_kill 0" mem.txt
          curl -sf localhost:8000/healthz
