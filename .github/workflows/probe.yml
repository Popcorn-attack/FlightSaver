name: Probe sources

# Captures real search payloads from GitHub's network and commits them as test fixtures.
on:
  push:
    paths: ["probes/**", ".github/workflows/probe.yml"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated target names (empty = all)"
        default: ""

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python probes/capture.py ${{ inputs.targets }}
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/live
          git diff --cached --quiet && exit 0
          git commit -m "Update live search fixtures [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
