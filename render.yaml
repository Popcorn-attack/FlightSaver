# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo/branch.
services:
  - type: web
    name: flightsaver
    runtime: docker
    plan: free
    branch: claude/flightsaver-flight-search-fm9vk3
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # entered in the dashboard when the Blueprint is created
      - key: FLIGHTSAVER_ACCESS_TOKEN
        generateValue: true # random passphrase; copy it from the service's Environment tab
      - key: TYPESAFE_API_KEY
        sync: false # optional, enables the Jev engine
      # 512 MB: lean headless Chromium, one page at a time. KAYAK needs more memory.
      - key: FLIGHTSAVER_BROWSER_LEAN
        value: "1"
      - key: FLIGHTSAVER_BROWSER_CONCURRENCY
        value: "1"
      - key: FLIGHTSAVER_PROVIDERS
        value: google_flights,trip_com,ctrip
      - key: FLIGHTSAVER_AI_DAILY_LIMIT
        value: "20" # AI chat messages per day; quick mode is unlimited and free. 0 turns AI off
      - key: FLIGHTSAVER_HISTORY
        value: /tmp/history.sqlite3 # free plan has no persistent disk
